name: PhotoCleanup
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  PhotoCleanup:
    type: application
    platform: iOS
    sources:
      - PhotoCleanup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PhotoCleanup
        PRODUCT_NAME: PhotoCleanup
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Cleanup
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo Cleanup reads your library so you can pick photos to keep and remove the rest."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Photo Cleanup adds the photos you keep to the Keep album."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PhotoCleanupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoCleanupTests
    dependencies:
      - target: PhotoCleanup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PhotoCleanupTests
        GENERATE_INFOPLIST_FILE: YES
  PhotoCleanupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhotoCleanupUITests
    dependencies:
      - target: PhotoCleanup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PhotoCleanupUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoCleanup
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  PhotoCleanup:
    build:
      targets:
        PhotoCleanup: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoCleanupTests
        - PhotoCleanupUITests
    archive:
      config: Release
